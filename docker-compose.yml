services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: miya
      POSTGRES_PASSWORD: miya
      POSTGRES_DB: miya
    ports:
      - "5432:5432"
    volumes:
      - miya_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miya -d miya"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  miya_postgres_data:
